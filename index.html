<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title data-i18n="pages.menuTitle">Tic Tac Toe</title>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="components.css">
	<link rel="stylesheet" href="index.css">
	<link rel="stylesheet" href="dialogs.css">
	<script src="preferences.js"></script>
	<script src="localization.js"></script>
</head>
<body>
	<main class="app-shell menu-shell">
        <header class="menu-header">
            <svg class="brand-board" viewBox="0 0 180 180" aria-hidden="true"><use href="assets/icons.svg#board"/></svg>
            <h1 data-i18n="common.gameTitle">Tic Tac Toe</h1>
            <p data-i18n="menu.tagline">Your next move starts here</p>
        </header>
        <nav aria-label="Main menu" data-i18n-aria-label="menu.navigationLabel">
            <button type="button" id="play" class="button button--primary menu-play"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#play"/></svg><span data-i18n="menu.play">Play</span></button>
            <div class="menu-grid">
                <button type="button" id="play-online" class="card menu-card"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#online"/></svg><span data-i18n="menu.playOnline">Play online</span></button>
                <a class="card menu-card" href="settings.html"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#settings"/></svg><span data-i18n="menu.settings">Settings</span></a>
                <a class="card menu-card" href="about.html"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#info"/></svg><span data-i18n="menu.about">About</span></a>
                <a class="card menu-card" href="#"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#exit"/></svg><span data-i18n="menu.exit">Exit</span></a>
            </div>
        </nav>
    </main>
    <dialog id="online-coming-soon" class="result-card" aria-labelledby="online-coming-soon-title">
        <p class="result-label" data-i18n="menu.onlineComingSoonLabel">PLAY ONLINE</p>
        <div class="result-icon" aria-hidden="true"><svg class="icon"><use href="assets/icons.svg#online"/></svg></div>
        <h2 id="online-coming-soon-title" data-i18n="menu.onlineComingSoonTitle">Coming soon, really soon</h2>
        <form method="dialog"><button type="submit" autofocus data-i18n="common.gotIt">Got it</button></form>
    </dialog>
	<script src="menu.js"></script>
</body>
</html>
