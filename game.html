<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title data-i18n="common.gameTitle">Tic Tac Toe</title>
	<link rel="stylesheet" href="theme.css">
	<link rel="stylesheet" href="components.css">
	<link rel="stylesheet" href="svg.css">
	<link rel="stylesheet" href="dialogs.css">
    <script src="preferences.js"></script>
    <script src="localization.js"></script>
</head>
<body id="body">
<header class="game-header">
    <p class="eyebrow" data-i18n="common.gameTitle">Tic Tac Toe</p>
    <div class="player-legend" aria-label="Player symbols" data-i18n-aria-label="game.playerSymbols">
        <span><b id="your-symbol" class="mark-x" aria-hidden="true">×</b> <span data-i18n="game.you">You</span></span>
        <span class="legend-divider" aria-hidden="true" data-i18n="game.versus">vs</span>
        <span><b id="computer-symbol" class="mark-o" aria-hidden="true">○</b> <span data-i18n="game.computer">Computer</span></span>
    </div>
</header>
<main class="game-stage" aria-label="Game board" data-i18n-aria-label="game.board">
<svg id='mySVG' viewBox='100 100 400 400' role="group" aria-label="Tic tac toe board" data-i18n-aria-label="game.ticTacToeBoard">

<!-- SVG for circles -->

	<circle cx="200" cy="200" r="40" stroke-width="0" fill-opacity="0.1" fill="white" id='c1' />
	<circle cx="300" cy="200" r="40" stroke-width="0" fill-opacity="0.1" fill="white" id='c2' />
	<circle cx="400" cy="200" r="40" stroke-width="0" fill-opacity="0.1" fill="white" id='c3' />
	<circle cx="200" cy="300" r="40" stroke-width="0" fill-opacity="0.1" fill="white" id='c4' />
	<circle cx="300" cy="300" r="40" stroke-width="0" fill-opacity="0.1" fill="white" id='c5' />
	<circle cx="400" cy="300" r="40" stroke-width="0" fill-opacity="0.1" fill="white" id='c6' />
	<circle cx="200" cy="400" r="40" stroke-width="0" fill-opacity="0.1" fill="white" id='c7' />
	<circle cx="300" cy="400" r="40" stroke-width="0" fill-opacity="0.1" fill="white" id='c8' />
	<circle cx="400" cy="400" r="40" stroke-width="0" fill-opacity="0.1" fill="white" id='c9' />
<!-- End CIRCLES -->


<!-- All CROSS -->

	<line x1="170" y1="170" class='1' x2="230" y2="230" stroke-width="0" />
	<line x1="230" y1="170" class='1' x2="170" y2="230" stroke-width="0" />
 
	<line x1="270" y1="170" class='2' x2="330" y2="230" stroke-width="0" />
	<line x1="330" y1="170" class='2' x2="270" y2="230" stroke-width="0" />
 
	<line x1="370" y1="170" class='3' x2="430" y2="230" stroke-width="0" />
	<line x1="430" y1="170" class='3' x2="370" y2="230" stroke-width="0" />
	 
	<line x1="170" y1="270" class='4' x2="230" y2="330" stroke-width="0" />
	<line x1="230" y1="270" class='4' x2="170" y2="330" stroke-width="0" />
	 
	<line x1="270" y1="270" class='5' x2="330" y2="330" stroke-width="0" />
	<line x1="330" y1="270" class='5' x2="270" y2="330" stroke-width="0" />
 
	<line x1="370" y1="270" class='6' x2="430" y2="330" stroke-width="0" />
	<line x1="430" y1="270" class='6' x2="370" y2="330" stroke-width="0" />
 
	<line x1="170" y1="370" class='7' x2="230" y2="430" stroke-width="0" />
	<line x1="230" y1="370" class='7' x2="170" y2="430" stroke-width="0" />
 
	<line x1="270" y1="370" class='8' x2="330" y2="430" stroke-width="0" />
	<line x1="330" y1="370" class='8' x2="270" y2="430" stroke-width="0" />
 
	<line x1="370" y1="370" class='9' x2="430" y2="430" stroke-width="0" />
	<line x1="430" y1="370" class='9' x2="370" y2="430" stroke-width="0" />
<!-- END CROSS -->
	
<!-- All Boxes of TIC TAC TOE -->

	<rect x="-300" y="-300" width="100" height="100" data-occupied='false' fill="#ffffff" fill-opacity="0.1" stroke-width="5" id="rect1" class='rects' />
	<rect x="-200" y="-300" width="100" height="100" data-occupied='false' fill="#ffffff" fill-opacity="0.1" stroke-width="5" id="rect2" class='rects' />
	<rect x="-100" y="-300" width="100" height="100" data-occupied='false' fill="#ffffff" fill-opacity="0.1" stroke-width="5" id="rect3" class='rects' />
	<rect x="-300" y="-200" width="100" height="100" data-occupied='false' fill="#ffffff" fill-opacity="0.1" stroke-width="5" id="rect4" class='rects' />
	<rect x="-200" y="-200" width="100" height="100" data-occupied='false' fill="#ffffff" fill-opacity="0.1" stroke-width="5" id="rect5" class='rects' />
	<rect x="-100" y="-200" width="100" height="100" data-occupied='false' fill="#ffffff" fill-opacity="0.1" stroke-width="5" id="rect6" class='rects' />
	<rect x="-300" y="-100" width="100" height="100" data-occupied='false' fill="#ffffff" fill-opacity="0.1" stroke-width="5" id="rect7" class='rects' />
	<rect x="-200" y="-100" width="100" height="100" data-occupied='false' fill="#ffffff" fill-opacity="0.1" stroke-width="5" id="rect8" class='rects' />
	<rect x="-100" y="-100" width="100" height="100" data-occupied='false' fill="#ffffff" fill-opacity="0.1" stroke-width="5" id="rect9" class='rects' />
<!-- End of Boxes -->

<!-- Victory lines -->

<line x1="150" y1="200" id='0012' x2="150" y2="200" stroke-width="5" /> <!-- Add 300 in x2 -->
<line x1="150" y1="300" id='1012' x2="150" y2="300" stroke-width="5" /> <!-- Add 300 in x2 -->
<line x1="150" y1="400" id='2012' x2="150" y2="400" stroke-width="5" /> <!-- Add 300 in x2 -->

<line x1="200" y1="150" id='0120' x2="200" y2="150" stroke-width="5" /> <!-- Add 300 in y2 -->
<line x1="300" y1="150" id='0121' x2="300" y2="150" stroke-width="5" /> <!-- Add 300 in y2 -->
<line x1="400" y1="150" id='0122' x2="400" y2="150" stroke-width="5" /> <!-- Add 300 in y2 -->

<line x1="150" y1="150" id='012' x2="150" y2="150"  stroke-width="5" />
<line x1="450" y1="150" id='210' x2="450" y2="150"  stroke-width="5" />
</svg>
</main>
<div class="game-controls">
	<button type="button" id="resign" class="button button--secondary"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#flag"/></svg><span data-i18n="game.resign">Resign</span></button>
</div>
<dialog id="resign-confirmation" class="result-card" data-outcome="resign" aria-labelledby="resign-title">
	<p class="result-label" data-i18n="game.resignLabel">LEAVE THIS ROUND?</p>
	<div class="result-icon" aria-hidden="true"><svg class="icon"><use href="assets/icons.svg#flag"/></svg></div>
	<h2 id="resign-title" data-i18n="game.resignConfirmation">Are you sure you want to resign?</h2>
	<div class="dialog-actions">
		<button type="button" id="confirm-resign" data-i18n="game.confirmResign">Yes, resign</button>
		<button type="button" id="cancel-resign" class="secondary-action" autofocus data-i18n="game.cancel">Cancel</button>
	</div>
</dialog>
<dialog id="game-result" class="result-card" aria-labelledby="result-title" aria-describedby="result-message">
	<div class="result-sparkles" aria-hidden="true"><span>✦</span><span>●</span><span>✧</span><span>✦</span></div>
	<p class="result-label" data-i18n="game.roundComplete">ROUND COMPLETE</p>
	<div id="result-icon" class="result-icon" aria-hidden="true"></div>
	<h2 id="result-title"></h2>
	<p id="result-message" class="result-message"></p>
	<button type="button" id="play-again" autofocus><span data-i18n="game.playAgain">Play another game</span> <span aria-hidden="true">↻</span></button>
	<button type="button" id="return-menu" class="secondary-action"><span data-i18n="game.returnToMainMenu">Return to main menu</span> <span aria-hidden="true">→</span></button>
</dialog>
<script type="text/javascript" src="animation.js">
</script>
<script type="text/javascript">
	createTicTacToe();
</script>



<script src="menu.js"></script>
<script src="result.js"></script>
<script type="text/javascript" src='game.js'></script>
<script src="resign.js"></script>
</body>
</html>
